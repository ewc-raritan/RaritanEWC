<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Raritan EWC Pizza Hot 優惠碼">
  <title>Pizza Hot 優惠碼｜Raritan EWC</title>

  <link rel="icon" type="image/png" href="assets/icon/favicon.png">
  <link rel="stylesheet" href="css/min/main_styles.min.css">
  <link rel="stylesheet" href="css/min/pizza_hot_css.min.css">

  <script src="js/min/header_footer_components.min.js" defer></script>
  <script src="js/min/footer_script.min.js" defer></script>
  <script src="js/min/pizza_hot_js.min.js" defer></script>
</head>
<body class="site-page">
  <site-header></site-header>

  <main class="pizza-page">
    <section class="pizza-content" aria-labelledby="pizza-title">
      <div class="pizza-content__inner">
        <header class="pizza-heading">
          <h1 id="pizza-title">Pizza Hot 優惠碼</h1>
          <p>優惠內容請以 Pizza Hot 實際提供為準。</p>
        </header>

        <div class="pizza-toolbar">
          <label class="pizza-search-wrap" for="pizza-search">
            <span class="sr-only">搜尋優惠品項</span>
            <input
              id="pizza-search"
              class="pizza-search"
              type="search"
              placeholder="搜尋品項，例如：烤腿排、芝心腸、超級夏威夷"
              autocomplete="off"
              disabled
            >
          </label>

          <p id="pizza-result-count" class="pizza-result-count" aria-live="polite">
            正在取得優惠資料...請稍後...
          </p>

          <button id="pizza-reload" class="pizza-reload" type="button" hidden>
            重新載入
          </button>
        </div>

        <div id="pizza-loading" class="pizza-loading" role="status">
          <span class="pizza-loading__spinner" aria-hidden="true"></span>
          <span>優惠資料載入中...</span>
        </div>

        <div id="pizza-error" class="pizza-message pizza-message--error" role="alert" hidden>
          <strong>目前無法取得優惠資料</strong>
          <span>請稍後再試，或按下重新載入。</span>
        </div>

        <div id="pizza-empty" class="pizza-message" hidden>
          沒有符合條件的優惠。
        </div>

        <div id="pizza-card-grid" class="pizza-card-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>
</body>
</html>
